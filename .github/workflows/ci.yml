name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # requirements-ci.lock holds the container's pins from requirements.lock
      # plus the audit tools, every one with its hash checked.
      - name: Install pinned dependencies and tools
        run: python -m pip install --require-hashes -r backend/requirements-ci.lock
      - name: Lock files match requirements.txt
        working-directory: backend
        run: |
          cp requirements.lock fresh-requirements.lock
          uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes -q --custom-compile-command "cd backend && uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes -o requirements.lock" -o fresh-requirements.lock
          diff requirements.lock fresh-requirements.lock
          cp requirements-ci.lock fresh-requirements-ci.lock
          uv pip compile requirements.txt requirements-ci.in -c requirements.lock --universal --python-version 3.12 --generate-hashes -q --custom-compile-command "cd backend && uv pip compile requirements.txt requirements-ci.in -c requirements.lock --universal --python-version 3.12 --generate-hashes -o requirements-ci.lock" -o fresh-requirements-ci.lock
          diff requirements-ci.lock fresh-requirements-ci.lock
      - name: Dependency audit (pip-audit)
        run: pip-audit -r backend/requirements.lock --progress-spinner off
      - name: Syntax check
        run: python -m py_compile backend/main.py backend/config.py backend/database.py
      - name: Import check
        run: |
          cd backend
          python -c "import main"
      - name: Run pytest suite
        run: |
          cd backend
          python -m pytest -v --cov=. --cov-report=term-missing:skip-covered

  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for backend to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend never came up"
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down
