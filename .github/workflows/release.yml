# Erzeugt das GitHub Release, sobald ein Versions-Tag gepusht wird.
#
# Ohne diesen Workflow entsteht beim Tag-Push nichts: der Tag liegt im Repo,
# ein Release gibt es nie. Genau so sind hier mehrere Versionen ohne Release
# liegengeblieben, sichtbar erst beim Vergleich von Tag- und Release-Liste.
#
# Das Repo liefert kein Binaerartefakt aus, deshalb baut dieser Workflow
# nichts. Er uebernimmt den passenden CHANGELOG-Abschnitt als Release-Notes,
# damit die Notes nicht getrennt von der Datei gepflegt werden muessen.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Nur was ueber das workflow-weite contents: read hinausgeht.
      # Read-Rechte hier zu wiederholen ist das, was OpenSSF Scorecard
      # als zu weite Token-Berechtigung bemaengelt.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the changelog section for this tag
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Vom Kopf des passenden Eintrags bis zum naechsten Eintrag lesen.
          # Der Trennstrich zwischen den Abschnitten gehoert nicht zu den Notes.
          awk -v marker="## [$version]" '
            index($0, marker) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^---$/ { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no changelog section found for $version" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Legt das Release an, falls es noch nicht existiert.
          #
          # Vorher brach der Schritt mit "a release with the same tag name already
          # exists" ab, sobald das Release schon auf anderem Weg entstanden war, und
          # der Lauf wurde rot, obwohl nichts fehlte. Dieses Repo haengt keine Dateien
          # an, also ist in dem Fall nichts zu tun.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Dieses Release existiert bereits, nichts zu tun."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
